<!-- offline.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gibi Store — Offline</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 20% 0%, #3B82F6 0%, #2563EB 45%, #1D4ED8 100%); color:#fff; text-align:center; padding:24px; }
  .box { max-width: 340px; }
  .icon-circle { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:rgba(255,255,255,.8); font-size:14px; margin:0 0 20px; }
  button { background:#F59E0B; color:#1E293B; border:none; padding:12px 22px; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon-circle">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 2 20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 13a10 10 0 0 1 3-2.1M19 13a10 10 0 0 0-4.6-2.7"/><path d="M2 8.8a15 15 0 0 1 4-2.5M22 8.8a15 15 0 0 0-8-4.3"/><path d="M12 20h.01"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Gibi Store needs an internet connection to load fresh listings. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
